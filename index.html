<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi Ashtamangala Prasna</title>
    <style>
        :root {
            --gold: #d4af37; --deep-red: #4a0404; --saffron: #f4c430; --dark-bg: #120a06; --card-bg: #1c110a; --text: #f0e6d2; --accent: #8b4513;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: var(--text); font-family: 'Palatino', serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 10px; background-image: radial-gradient(circle at center, #2a1810 0%, #120a06 100%); min-height: 100vh; }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin: 15px 0; border-bottom: 2px solid var(--gold); padding-bottom: 5px; font-size: 1.3rem; text-align: center; }
        
        .top-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .lang-btn, .action-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 4px 8px; cursor: pointer; font-size: 0.65rem; border-radius: 4px; }
        .active { background: var(--gold) !important; color: var(--deep-red) !important; }

        .container { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .card { background: var(--card-bg); border: 1px solid var(--accent); padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-bottom: 10px; }
        .full-width { grid-column: 1 / -1; }
        
        canvas { background: #050505; border: 3px double var(--gold); border-radius: 8px; display: block; margin: 0 auto; max-width: 100%; height: auto; }
        
        input { width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid var(--accent); color: white; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; text-align: center; }
        button.main-btn { background: var(--deep-red); color: var(--gold); border: 1px solid var(--gold); padding: 12px; cursor: pointer; text-transform: uppercase; width: 100%; border-radius: 4px; font-size: 0.9rem; font-weight: bold; }
        
        .narrative-section { margin-bottom: 30px; }
        .narrative-title { color: var(--saffron); font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--gold); padding-bottom: 5px; }
        .text-technical { font-style: italic; color: #fff; margin-bottom: 10px; line-height: 1.6; font-size: 1.05rem; }
        .text-colloquial { color: #d1c7b7; line-height: 1.5; font-size: 0.95rem; }
        .insight-box { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); padding: 15px; border-radius: 8px; margin-top: 20px; font-style: italic; color: var(--gold); }
        .remedy-item { margin-bottom: 8px; color: var(--saffron); font-weight: bold; }

        .loading { text-align: center; padding: 20px; color: var(--saffron); animation: glow 2s infinite; font-size: 0.85rem; }
        @keyframes glow { 50% { opacity: 0.5; } }
    </style>
    <script src="config.js"></script>
</head>
<body>

    <h1>Rishi Ashtamangala</h1>

    <div class="top-controls">
        <div class="lang-selector">
            <button class="lang-btn active" id="btn-en" onclick="setLang('en')">ENG</button>
            <button class="lang-btn" id="btn-es" onclick="setLang('es')">ESP</button>
            <button class="lang-btn" id="btn-it" onclick="setLang('it')">ITA</button>
        </div>
        <button class="action-btn" onclick="toggleExplorer()">📜 History</button>
    </div>

    <div class="input-group" style="width:100%; max-width:600px;">
        <input type="text" id="userQuestion" placeholder="Enter your question for the Oracle...">
        <div class="container" style="grid-template-columns: 1fr 1fr; margin-bottom: 10px;">
            <div class="card"><input type="number" id="bLat" placeholder="Birth Lat" step="any"><input type="number" id="bLon" placeholder="Birth Lon" step="any"><input type="datetime-local" id="bTime"></div>
            <div class="card"><input type="number" id="pLat" placeholder="Current Lat" step="any"><input type="number" id="pLon" placeholder="Current Lon" step="any"><button class="main-btn" style="font-size:0.6rem; padding:5px" onclick="useMyLocation()">Detect Location</button></div>
        </div>
        <button class="main-btn" onclick="runCast()">Invoke Sacred Ceremony</button>
    </div>

    <div class="container">
        <div class="card full-width"><canvas id="chartCanvas" width="600" height="600"></canvas></div>
        <div id="results" class="full-width" style="display:none;">
            <div class="card"><h2 id="struct-title" style="color:var(--gold); text-align:center;"></h2><div id="structure-content"></div></div>
            <div class="card"><h2 id="advice-title" style="color:var(--gold); text-align:center;"></h2><div id="advice-content"></div></div>
        </div>
    </div>

    <script>
        const API_BASE = window.APP_CONFIG.API_BASE_URL;
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const rashiSanskrit = ["Mesha", "Vrishabha", "Mithuna", "Karka", "Simha", "Kanya", "Thula", "Vrischika", "Dhanus", "Makara", "Kumbha", "Meena"];
        const houseCoords = { 12:[0,0], 1:[1,0], 2:[2,0], 3:[3,0], 11:[0,1], 4:[3,1], 10:[0,2], 5:[3,2], 9:[0,3], 8:[1,3], 7:[2,3], 6:[3,3] };
        const planetColors = { "Sun":"#FFD700", "Moon":"#C0C0C0", "Mars":"#FF4500", "Mercury":"#32CD32", "Jupiter":"#F4C430", "Venus":"#FF69B4", "Saturn":"#4682B4" };
        let currentLang = 'en';

        function setLang(l) { currentLang = l; document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+l).classList.add('active'); }
        function useMyLocation() { navigator.geolocation.getCurrentPosition(p => { document.getElementById('pLat').value = p.coords.latitude.toFixed(4); document.getElementById('pLon').value = p.coords.longitude.toFixed(4); }); }

        function drawGoldCoin(x, y) {
            ctx.save(); ctx.translate(x, y);
            const grad = ctx.createRadialGradient(0,0,2, 0,0,14);
            grad.addColorStop(0, "#fff7ad"); grad.addColorStop(0.5, "#d4af37"); grad.addColorStop(1, "#8b4513");
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0, 14, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.font = "bold 9px Arial"; ctx.textAlign="center"; ctx.fillText("SRI", 0, 3);
            ctx.restore();
        }

        function drawShell(x, y, isUp) {
            ctx.save(); ctx.translate(x, y);
            ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI * 2);
            if (isUp) { ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-2.5, 0); ctx.lineTo(2.5, 0); ctx.stroke(); }
            else { ctx.fillStyle = 'rgba(212, 175, 55, 0.5)'; ctx.fill(); ctx.strokeStyle = '#d4af37'; ctx.stroke(); }
            ctx.restore();
        }

        function drawChart(cast, transitPlanets = {}) {
            const size = canvas.width; const step = size / 4; ctx.clearRect(0,0,size,size);
            for(let h=1; h<=12; h++) {
                const [cx, cy] = houseCoords[h]; const x = cx * step, y = cy * step;
                const shells = cast.board[h] || [];
                const up = shells.filter(s => s.up === "UP").length;
                const dn = shells.length - up;
                const ratio = shells.length > 0 ? up / shells.length : 0.5;
                
                // --- 1. Background Coloring ---
                // Reddish (DN) to Goldish (UP) interpolation
                const r = Math.floor(40 + ratio * 120);
                const g = Math.floor(20 + ratio * 100);
                const b = Math.floor(10 + ratio * 30);
                
                let hasPlanet = false;
                for (const p in transitPlanets) { if (transitPlanets[p].house === h) hasPlanet = true; }
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${hasPlanet ? 0.7 : 0.4})`;
                ctx.fillRect(x, y, step, step);
                ctx.strokeStyle = "rgba(212,175,55,0.3)"; ctx.lineWidth = 1;
                ctx.strokeRect(x, y, step, step);

                // --- 2. House Summary Overlay ---
                ctx.fillStyle = "rgba(255,255,255,0.15)";
                ctx.font = "bold 40px serif"; ctx.textAlign="center";
                ctx.fillText(h, x + step/2, y + step/2 + 15);

                // House Name
                ctx.fillStyle = "#d4af37"; ctx.font = "bold 11px serif";
                ctx.fillText(rashiSanskrit[h-1], x + step/2, y + 15);
                
                // U/D Summary
                ctx.font = "bold 9px Arial"; ctx.fillStyle = "rgba(212,175,55,0.8)";
                ctx.fillText(`${up}U / ${dn}D`, x + step/2, y + step - 8);

                // --- 3. Planet Stacking ---
                let py = 30;
                let planetsInHouse = Object.entries(transitPlanets).filter(([p, d]) => d.house === h);
                planetsInHouse.forEach(([p, d], idx) => {
                    ctx.fillStyle = planetColors[p] || "#fff";
                    ctx.font = "bold 10px Arial";
                    // Stack them or space them
                    const px = x + 15 + (idx % 2) * (step - 30);
                    const currentPy = y + 30 + Math.floor(idx / 2) * 12;
                    ctx.textAlign = (idx % 2 === 0) ? "left" : "right";
                    ctx.fillText(p.slice(0,2), px, currentPy);
                });
                ctx.textAlign = "center";

                // --- 4. Special Markers ---
                if (h === cast.arudha) drawGoldCoin(x + step - 25, y + 25);
                if (cast.janma_lagna && cast.janma_lagna.house === h) {
                    ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2;
                    ctx.strokeRect(x+6, y+6, step-12, step-12);
                    ctx.fillStyle = "#00ff00"; ctx.font = "bold 9px Arial";
                    ctx.fillText("LAGNA", x+step/2, y+step-20);
                }

                // --- 5. Shells Grid ---
                const shellAreaY = 45 + Math.ceil(planetsInHouse.length / 2) * 12;
                shells.forEach((s, idx) => {
                    const sx = x + 15 + (idx % 6) * 15;
                    const sy = y + shellAreaY + Math.floor(idx / 6) * 10;
                    if (sy < y + step - 15) drawShell(sx, sy, s.up === "UP");
                });
            }
            // Center Motif
            ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 3; ctx.strokeRect(0,0,size,size);
            ctx.fillStyle="#d4af37"; ctx.font="30px serif"; ctx.fillText("ॐ", size/2, size/2+10);
        }

        async function runCast() {
            const q = document.getElementById("userQuestion").value;
            const b = { lat: parseFloat(document.getElementById('bLat').value), lon: parseFloat(document.getElementById('bLon').value), time: document.getElementById('bTime').value };
            const p = { lat: parseFloat(document.getElementById('pLat').value), lon: parseFloat(document.getElementById('pLon').value), time: new Date().toISOString() };
            
            document.getElementById("results").style.display = "none";
            document.getElementById("structure-content").innerHTML = '<div class="loading">Consulting the Cosmic Weave...</div>';
            
            try {
                const nist = await fetch("https://beacon.nist.gov/beacon/2.0/pulse/last").then(r => r.json());
                const bits = [...nist.pulse.outputValue].map(h => parseInt(h,16).toString(2).padStart(4,"0")).join("");
                const cast = await fetch(`${API_BASE}/cast`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bits, q, lang: currentLang, birth: b.lat ? b : undefined, prasna: p.lat ? p : undefined }) }).then(r => r.json());
                
                drawChart(cast, cast.transit_planets);

                const struct = await fetch(`${API_BASE}/interpret/structure`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cast }) }).then(r => r.json());
                document.getElementById("struct-title").innerText = struct.analysis_title || "Celestial Structure";
                const structSections = struct.sections || [];
                document.getElementById("structure-content").innerHTML = structSections.map(s => `
                    <div class="narrative-section">
                        <span class="narrative-title">${s.title || "Observation"}</span>
                        <p class="text-technical">${s.technical_rishi || s.technical}</p>
                        <p class="text-colloquial">${s.colloquial_modern || s.colloquial}</p>
                    </div>`).join("") + (struct.concluding_insight ? `<div class="insight-box">${struct.concluding_insight}</div>` : "");

                const advice = await fetch(`${API_BASE}/interpret/advice`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cast, structure: struct }) }).then(r => r.json());
                const adv = advice.spiritual_guidance || advice;
                document.getElementById("advice-title").innerText = adv.counsel_title || "Spiritual Guidance";
                const advNarrative = adv.guidance_narrative || adv.narrative_sections || [];
                const remedies = adv.specific_remedies || [];
                
                document.getElementById("advice-content").innerHTML = advNarrative.map(s => `
                    <div class="narrative-section">
                        <span class="narrative-title">${s.heading || s.title}</span>
                        <p class="text-colloquial">${s.content || s.body}</p>
                    </div>`).join("") + `
                    <div class="narrative-section">
                        <span class="narrative-title">Sacred Remedies</span>
                        <ul style="padding-left:20px">${remedies.map(r => `<li class="remedy-item">${r}</li>`).join("")}</ul>
                    </div>
                    <div class="insight-box" style="color:var(--saffron); border-color:var(--saffron)">
                        <strong>Final Prediction:</strong> ${adv.final_prediction}
                    </div>`;

                document.getElementById("results").style.display = "block";
            } catch (err) { console.error(err); alert("Ritual interrupted."); }
        }
        drawChart({arudha:0, board:{}});
    </script>
</body>
</html>
