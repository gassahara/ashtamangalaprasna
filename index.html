<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi Ashtamangala Prasna</title>
    <style>
        :root {
            --gold: #d4af37; --deep-red: #4a0404; --saffron: #f4c430; --dark-bg: #120a06; --card-bg: #1c110a; --text: #f0e6d2; --accent: #8b4513;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--dark-bg); color: var(--text); font-family: 'Palatino', serif; margin: 0; overflow-x: hidden; min-height: 100vh; background-image: radial-gradient(circle at center, #2a1810 0%, #120a06 100%); }
        
        #main-app { display: flex; flex-direction: column; align-items: center; padding: 10px; transition: filter 0.8s ease, opacity 0.8s ease; }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin: 15px 0; border-bottom: 2px solid var(--gold); padding-bottom: 5px; font-size: 1.3rem; text-align: center; }
        
        .top-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .lang-btn, .action-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 4px 8px; cursor: pointer; font-size: 0.65rem; border-radius: 4px; transition: 0.3s; }
        .active { background: var(--gold) !important; color: var(--deep-red) !important; }

        .container { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .card { background: var(--card-bg); border: 1px solid var(--accent); padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin-bottom: 10px; }
        .full-width { grid-column: 1 / -1; }
        
        canvas { background: #050505; border: 3px double var(--gold); border-radius: 8px; display: block; margin: 0 auto; max-width: 100%; height: auto; }
        
        input { width: 100%; padding: 8px; background: #0a0a0a; border: 1px solid var(--accent); color: white; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; text-align: center; }
        button.main-btn { background: var(--deep-red); color: var(--gold); border: 1px solid var(--gold); padding: 12px; cursor: pointer; text-transform: uppercase; width: 100%; border-radius: 4px; font-size: 0.9rem; font-weight: bold; }
        
        /* Response Styles */
        .narrative-section { margin-bottom: 30px; border-bottom: 1px solid rgba(212, 175, 55, 0.1); padding-bottom: 15px; }
        .narrative-title { color: var(--saffron); font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .text-technical { font-style: italic; color: #fff; margin-bottom: 10px; line-height: 1.6; font-size: 1.05rem; }
        .text-colloquial { color: #d1c7b7; line-height: 1.5; font-size: 0.95rem; }
        .insight-box { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); padding: 15px; border-radius: 8px; margin-top: 20px; font-style: italic; color: var(--gold); }
        .remedy-item { margin-bottom: 8px; color: var(--saffron); font-weight: bold; }

        /* --- MEDITATION OVERLAY (Tattva Animation) --- */
        #meditation-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(18, 10, 6, 0.98);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .om-symbol {
            font-size: 10rem; color: var(--gold);
            text-shadow: 0 0 50px rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
            animation: pulse-glow 4s infinite ease-in-out;
            user-select: none;
            z-index: 2005;
        }

        .tattva-symbol {
            position: absolute; width: 30px; height: 30px;
            opacity: 0.8; box-shadow: 0 0 15px rgba(255,255,255,0.2);
            z-index: 2004;
        }
        /* Earth: Yellow Square */
        .t-earth { background: #f4c430; }
        /* Water: Silver Crescent */
        .t-water { background: #c0c0c0; border-radius: 50% 50% 0 0; height: 15px; }
        /* Fire: Red Triangle */
        .t-fire { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #ff4500; background: none; }
        /* Air: Blue Circle */
        .t-air { background: #4682b4; border-radius: 50%; }
        /* Spirit: Indigo Egg */
        .t-spirit { background: #4b0082; border-radius: 50% / 70%; }

        #meditation-status {
            color: var(--gold); font-family: serif; font-style: italic;
            letter-spacing: 3px; margin-top: 80px; text-align: center;
            font-size: 1.2rem; z-index: 2006;
        }

        /* --- WAITING OVERLAY (Point Animation) --- */
        #waiting-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(18, 10, 6, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1900;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .golden-point {
            width: 12px; height: 12px; background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 20px 5px var(--gold);
            position: absolute;
        }

        .app-blurred { filter: blur(12px); opacity: 0.3; pointer-events: none; }

        /* History & Modals */
        #history-explorer { margin-top: 30px; width: 100%; max-width: 1000px; display: none; }
        .history-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--accent); cursor: pointer; font-size: 0.8rem; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 2px solid var(--gold); border-radius: 12px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 20px; }
    </style>
    <script src="config.js"></script>
</head>
<body>

    <div id="meditation-overlay">
        <div class="om-symbol">ॐ</div>
        <div id="tattva-container" style="position:absolute; width: 100vw; height: 100vh; overflow:hidden;">
            <div class="tattva-symbol t-earth" id="t1"></div>
            <div class="tattva-symbol t-water" id="t2"></div>
            <div class="tattva-symbol t-fire" id="t3"></div>
            <div class="tattva-symbol t-air" id="t4"></div>
            <div class="tattva-symbol t-spirit" id="t5"></div>
        </div>
        <div id="meditation-status">Aligning with the Tattvas...</div>
    </div>

    <div id="waiting-overlay">
        <div class="golden-point" id="sacred-point"></div>
        <div style="margin-top:100px; color:var(--saffron); font-family:serif; font-style:italic;">Scanning the celestial loom...</div>
    </div>

    <div id="main-app">
        <h1>Rishi Ashtamangala</h1>

        <div class="top-controls">
            <div class="lang-selector">
                <button class="lang-btn active" id="btn-en" onclick="setLang('en')">ENG</button>
                <button class="lang-btn" id="btn-es" onclick="setLang('es')">ESP</button>
                <button class="lang-btn" id="btn-it" onclick="setLang('it')">ITA</button>
            </div>
            <button class="action-btn" onclick="toggleExplorer()">📜 History</button>
            <div style="display:flex; align-items:center; gap:5px; font-size:0.65rem;">
                <span>Memory (min):</span>
                <input type="number" id="memoryMins" value="30" style="width:40px; margin:0; padding:2px;">
            </div>
        </div>

        <div class="input-group" style="width:100%; max-width:600px;">
            <input type="text" id="userQuestion" placeholder="Enter your question for the Oracle...">
            <div class="container" style="grid-template-columns: 1fr 1fr; margin-bottom: 10px;">
                <div class="card" style="padding:10px;">
                    <h3 style="font-size: 0.65rem; margin: 0 0 5px 0; color: var(--gold); text-align: center;">Janma (Birth)</h3>
                    <input type="number" id="bLat" placeholder="Lat" step="any">
                    <input type="number" id="bLon" placeholder="Lon" step="any">
                    <input type="datetime-local" id="bTime">
                </div>
                <div class="card" style="padding:10px;">
                    <h3 style="font-size: 0.65rem; margin: 0 0 5px 0; color: var(--gold); text-align: center;">Prasna (Current)</h3>
                    <input type="number" id="pLat" placeholder="Lat" step="any">
                    <input type="number" id="pLon" placeholder="Lon" step="any">
                    <button class="action-btn" onclick="useMyLocation()" style="width: 100%; margin-top: 5px;">📍 Detect Geo</button>
                </div>
            </div>
            <button class="main-btn" onclick="startRitual()">Invoke Sacred Ceremony</button>
        </div>

        <div class="container">
            <div class="card full-width"><canvas id="chartCanvas" width="600" height="600"></canvas></div>
            <div id="results" class="full-width" style="display:none;">
                <div class="card"><h2 id="struct-title" style="color:var(--gold); text-align:center;"></h2><div id="structure-content"></div></div>
                <div class="card"><h2 id="advice-title" style="color:var(--gold); text-align:center;"></h2><div id="advice-content"></div></div>
            </div>
        </div>

        <div id="history-explorer">
            <h2>Previous Consultations</h2>
            <div id="history-list"></div>
            <button class="action-btn" onclick="clearHistory()" style="margin-top:10px; color:red;">Clear History</button>
        </div>
    </div>

    <div id="historyModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="action-btn" onclick="closeModal()" style="float:right">X</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.APP_CONFIG.API_BASE_URL;
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const rashiSanskrit = ["Mesha", "Vrishabha", "Mithuna", "Karka", "Simha", "Kanya", "Thula", "Vrischika", "Dhanus", "Makara", "Kumbha", "Meena"];
        const houseCoords = { 12:[0,0], 1:[1,0], 2:[2,0], 3:[3,0], 11:[0,1], 4:[3,1], 10:[0,2], 5:[3,2], 9:[0,3], 8:[1,3], 7:[2,3], 6:[3,3] };
        
        let currentLang = 'en'; 

        const i18n = {
            en: { 
                up: "Upright", dn: "Reversed",
                planets: { "Sun":"Surya", "Moon":"Chandra", "Mars":"Mangala", "Mercury":"Budha", "Jupiter":"Guru", "Venus":"Shukra", "Saturn":"Shani", "Rahu":"Rahu", "Ketu":"Ketu", "Uranus":"Indra" }
            },
            es: { 
                up: "Derecho", dn: "Invertido",
                planets: { "Sun":"Surya", "Moon":"Chandra", "Mars":"Mangala", "Mercury":"Budha", "Jupiter":"Guru", "Venus":"Shukra", "Saturn":"Shani", "Rahu":"Rahu", "Ketu":"Ketu", "Uranus":"Indra" }
            },
            it: { 
                up: "Diritto", dn: "Rovescio",
                planets: { "Sun":"Surya", "Moon":"Chandra", "Mars":"Mangala", "Mercury":"Budha", "Jupiter":"Guru", "Venus":"Shukra", "Saturn":"Shani", "Rahu":"Rahu", "Ketu":"Ketu", "Uranus":"Indra" }
            }
        };

        const planetColors = { "Sun":"#FFD700", "Moon":"#C0C0C0", "Mars":"#FF4500", "Mercury":"#32CD32", "Jupiter":"#F4C430", "Venus":"#FF69B4", "Saturn":"#4682B4", "Rahu":"#4B0082", "Ketu":"#808080", "Uranus":"#AFEEEE" };

        function setLang(l) { currentLang = l; document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+l).classList.add('active'); }
        function useMyLocation() { if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { document.getElementById('pLat').value = p.coords.latitude.toFixed(4); document.getElementById('pLon').value = p.coords.longitude.toFixed(4); }); }

        function drawGoldCoin(x, y) {
            ctx.save(); ctx.translate(x, y);
            const grad = ctx.createRadialGradient(0,0,2, 0,0,14);
            grad.addColorStop(0, "#fff7ad"); grad.addColorStop(0.5, "#d4af37"); grad.addColorStop(1, "#8b4513");
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0, 14, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.font = "bold 9px Arial"; ctx.textAlign="center"; ctx.fillText("SRI", 0, 3);
            ctx.restore();
        }

        function drawShell(x, y, isUp) {
            ctx.save(); ctx.translate(x, y);
            ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI * 2);
            if (isUp) { ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-2.5, 0); ctx.lineTo(2.5, 0); ctx.stroke(); }
            else { ctx.fillStyle = 'rgba(212, 175, 55, 0.5)'; ctx.fill(); ctx.strokeStyle = '#d4af37'; ctx.stroke(); }
            ctx.restore();
        }

        function drawChart(cast, transitPlanets = {}) {
            const size = canvas.width; const step = size / 4; ctx.clearRect(0,0,size,size);
            const t = i18n[currentLang];
            for(let h=1; h<=12; h++) {
                const [cx, cy] = houseCoords[h]; const x = cx * step, y = cy * step;
                const shells = (cast && cast.board) ? cast.board[h] : [];
                const up = shells.filter(s => s.up === "UP").length;
                const dn = shells.length - up;
                const ratio = shells.length > 0 ? up / shells.length : 0.5;
                
                let hasPlanet = false;
                for (const p in transitPlanets) { if (transitPlanets[p].house === h) hasPlanet = true; }
                
                ctx.fillStyle = `rgba(${Math.floor(50 + ratio * 100)}, ${Math.floor(25 + ratio * 50)}, 10, ${hasPlanet ? 0.7 : 0.4})`;
                ctx.fillRect(x,y,step,step);
                ctx.strokeStyle = "rgba(212,175,55,0.3)"; ctx.strokeRect(x,y,step,step);
                
                ctx.fillStyle = "#d4af37"; ctx.font = "bold 10px serif"; ctx.textAlign="center";
                ctx.fillText(rashiSanskrit[h-1], x+step/2, y+15);
                ctx.font = "bold 8px Arial"; ctx.fillText(`${up}${t.up[0]} / ${dn}${t.dn[0]}`, x+step/2, y+step-8);
                
                let planetsInHouse = Object.entries(transitPlanets).filter(([p, d]) => d.house === h);
                planetsInHouse.forEach(([p, d], idx) => {
                    ctx.fillStyle = planetColors[p] || "#fff";
                    ctx.font = "bold 9px Arial";
                    const px = x + 10 + (idx % 2) * (step - 20);
                    const py = y + 28 + Math.floor(idx / 2) * 10;
                    ctx.textAlign = (idx % 2 === 0) ? "left" : "right";
                    ctx.fillText(`${i18n[currentLang].planets[p] || p}`, px, py);
                });
                ctx.textAlign = "center";

                if (cast && h === cast.arudha) drawGoldCoin(x+step-25, y+25);
                if (cast && cast.janma_lagna && cast.janma_lagna.house === h) {
                    ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2; ctx.strokeRect(x+5,y+5,step-10,step-10);
                    ctx.fillStyle = "#00ff00"; ctx.font = "bold 9px Arial"; ctx.fillText("LAGNA", x+step/2, y+step-20);
                }
                
                shells.forEach((s, idx) => {
                    let sx, sy;
                    if (s.pos) {
                        sx = x + 10 + (s.pos[0] / 100) * (step - 20);
                        sy = y + 40 + (s.pos[1] / 100) * (step - 60);
                    } else {
                        sx = x + 12 + (idx % 5) * 18;
                        sy = y + 40 + Math.floor(idx / 5) * 10;
                    }
                    if (sy < y + step - 15) drawShell(sx, sy, s.up === "UP");
                });
            }
            ctx.strokeStyle = "#d4af37"; ctx.lineWidth = 3; ctx.strokeRect(0,0,size,size);
            ctx.fillStyle="#d4af37"; ctx.font="30px serif"; ctx.fillText("ॐ", size/2, size/2+10);
        }

        // History
        function saveSession(data) { let h = JSON.parse(localStorage.getItem('rishi_history') || '[]'); h.unshift({ ...data, timestamp: Date.now() }); localStorage.setItem('rishi_history', JSON.stringify(h)); }
        function getMemoryHistory() { 
            const mins = parseInt(document.getElementById('memoryMins').value) || 30;
            const h = JSON.parse(localStorage.getItem('rishi_history') || '[]');
            const now = Date.now();
            return h.filter(x => x.timestamp > now - (mins * 60000)).map(x => ({
                time_ago: `${Math.round((now - x.timestamp)/60000)}m ago`,
                question: x.cast.question,
                technical_summary: x.structure?.analysis_title,
                spiritual_prediction: x.advice?.final_prediction || x.advice?.spiritual_guidance?.final_prediction
            }));
        }
        function toggleExplorer() { const e = document.getElementById('history-explorer'); e.style.display = e.style.display === 'block' ? 'none' : 'block'; if (e.style.display === 'block') renderHistory(); }
        function renderHistory() { const l = document.getElementById('history-list'); const h = JSON.parse(localStorage.getItem('rishi_history') || '[]'); l.innerHTML = h.map((x, i) => `<div class="history-item" onclick="viewHistoryItem(${i})"><strong>${new Date(x.timestamp).toLocaleString()}</strong> - ${x.cast.question || 'General'}</div>`).join('') || '<p>No history.</p>'; }
        function viewHistoryItem(i) { 
            const x = JSON.parse(localStorage.getItem('rishi_history'))[i]; 
            const b = document.getElementById('modalBody');
            b.innerHTML = `<h3>${x.cast.question || 'Reading'}</h3><p>${new Date(x.timestamp).toLocaleString()}</p><hr><div id="hist-struct"></div><div id="hist-advice"></div>`;
            renderStructureUI(x.structure, 'hist-struct');
            renderAdviceUI(x.advice, 'hist-advice');
            document.getElementById('historyModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('historyModal').style.display = 'none'; }
        function clearHistory() { if (confirm('Clear?')) { localStorage.removeItem('rishi_history'); renderHistory(); } }

        function renderStructureUI(struct, containerId) {
            const container = document.getElementById(containerId);
            document.getElementById("struct-title").innerText = struct.analysis_title || "Celestial Structure";
            const sections = struct.sections || [];
            container.innerHTML = sections.map(s => `
                <div class="narrative-section">
                    <span class="narrative-title">${s.title || "Observation"}</span>
                    <p class="text-technical">${s.technical_rishi || s.technical}</p>
                    <p class="text-colloquial">${s.colloquial_modern || s.colloquial}</p>
                </div>`).join("") + (struct.concluding_insight ? `<div class="insight-box">${struct.concluding_insight}</div>` : "");
        }

        function renderAdviceUI(advice, containerId) {
            const container = document.getElementById(containerId);
            const adv = advice.spiritual_guidance || advice;
            document.getElementById("advice-title").innerText = adv.counsel_title || "Spiritual Guidance";
            const narr = adv.guidance_narrative || adv.narrative_sections || [];
            const rems = adv.specific_remedies || [];
            container.innerHTML = narr.map(s => `
                <div class="narrative-section">
                    <span class="narrative-title">${s.heading || s.title}</span>
                    <p class="text-colloquial">${s.content || s.body}</p>
                </div>`).join("") + `
                <div class="narrative-section">
                    <span class="narrative-title">Sacred Remedies</span>
                    <ul style="padding-left:20px">${rems.map(r => `<li class="remedy-item">${r}</li>`).join("")}</ul>
                </div>
                <div class="insight-box" style="color:var(--saffron); border-color:var(--saffron)">
                    <strong>Final Prediction:</strong> ${adv.final_prediction}
                </div>`;
        }

        async function runMeditation() {
            const overlay = document.getElementById('meditation-overlay');
            const status = document.getElementById('meditation-status');
            const symbols = [document.getElementById('t1'), document.getElementById('t2'), document.getElementById('t3'), document.getElementById('t4'), document.getElementById('t5')];
            const duration = (Math.floor(Math.random() * (46 - 21 + 1)) + 21) * 1000;
            overlay.style.display = 'flex';
            const start = Date.now();
            return new Promise(resolve => {
                function frame() {
                    const elapsed = Date.now() - start;
                    const progress = elapsed / duration;
                    if (progress < 1) {
                        symbols.forEach((s, i) => {
                            const angle = (progress * Math.PI * 10) + (i * (Math.PI * 2 / 5));
                            const radius = (1 - progress) * (window.innerWidth / 3) + 50;
                            const x = Math.cos(angle) * radius + window.innerWidth / 2;
                            const y = Math.sin(angle) * radius + window.innerHeight / 2;
                            s.style.left = (x - 15) + 'px';
                            s.style.top = (y - 15) + 'px';
                            s.style.opacity = Math.max(0, 1 - progress);
                        });
                        requestAnimationFrame(frame);
                    } else {
                        status.innerText = "The Tattvas converge...";
                        setTimeout(resolve, 1000);
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        async function runPointAnimation() {
            const point = document.getElementById('sacred-point');
            const start = Date.now();
            let animId;
            return {
                start: () => {
                    function f() {
                        const t = (Date.now() - start) / 2000;
                        const x = Math.sin(t * 3) * Math.cos(t * 2) * 200 + window.innerWidth / 2;
                        const y = Math.cos(t * 3) * Math.sin(t * 2) * 200 + window.innerHeight / 2;
                        point.style.left = x + 'px';
                        point.style.top = y + 'px';
                        animId = requestAnimationFrame(f);
                    }
                    f();
                },
                stop: () => cancelAnimationFrame(animId)
            };
        }

        async function startRitual() {
            const q = document.getElementById("userQuestion").value;
            const b = { lat: parseFloat(document.getElementById('bLat').value), lon: parseFloat(document.getElementById('bLon').value), time: document.getElementById('bTime').value };
            const p = { lat: parseFloat(document.getElementById('pLat').value), lon: parseFloat(document.getElementById('pLon').value), time: new Date().toISOString() };
            
            await runMeditation();
            
            const medOverlay = document.getElementById('meditation-overlay');
            const waitOverlay = document.getElementById('waiting-overlay');
            const app = document.getElementById('main-app');
            
            medOverlay.style.display = 'none';
            waitOverlay.style.display = 'flex';
            app.classList.add('app-blurred');
            
            const pointAnim = await runPointAnimation();
            pointAnim.start();

            try {
                const nist = await fetch("https://beacon.nist.gov/beacon/2.0/pulse/last").then(r => r.json());
                const bits = [...nist.pulse.outputValue].map(h => parseInt(h,16).toString(2).padStart(4,"0")).join("");
                const cast = await fetch(`${API_BASE}/cast`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bits, q, lang: currentLang, birth: b.lat ? b : undefined, prasna: p.lat ? p : undefined }) }).then(r => r.json());
                
                drawChart(cast, cast.transit_planets);

                const struct = await fetch(`${API_BASE}/interpret/structure`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cast, history: getMemoryHistory() }) }).then(r => r.json());
                renderStructureUI(struct, 'structure-content');

                const advice = await fetch(`${API_BASE}/interpret/advice`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cast, structure: struct, history: getMemoryHistory() }) }).then(r => r.json());
                renderAdviceUI(advice, 'advice-content');

                document.getElementById("results").style.display = "block";
                saveSession({ cast, structure: struct, advice });
                
                pointAnim.stop();
                waitOverlay.style.display = 'none';
                app.classList.remove('app-blurred');

            } catch (err) { 
                console.error(err);
                alert("Ritual interrupted."); 
                pointAnim.stop();
                waitOverlay.style.display = 'none';
                app.classList.remove('app-blurred');
            }
        }
        
        drawChart(null);
    </script>
</body>
</html>
